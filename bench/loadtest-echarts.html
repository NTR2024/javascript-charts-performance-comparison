<html>
    <head>
        <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
        <style>
            body {
                margin: 0px;
            }

            #chart {
                width: 100vw;
                height: 100vh;
            }
        </style>
    </head>

    <body>
        <div id="chart"></div>
        <script src="common.js"></script>
        <script>
            window.testSetup().then(({ channels, dataSetSize, appendPointsPerSecond, testAppend, appendTestDurationMs, feature }) => {
                let startInit = window.performance.now()
                 // Initialize data
                const xs = new Array(dataSetSize)
                for (let i = 0; i < dataSetSize; i += 1) {
                    xs[i] = i
                }
                const dataSetsY = new Array(channels).fill(0).map((_, ch) => {
                    const ys = new Array(dataSetSize)
                    for (let i = 0; i < dataSetSize; i += 1) {
                        ys[i] = Math.random() + ch
                    }
                    return ys
                })
                const channelData = dataSetsY.map((yArray) => {
                    return xs.map((x, index) => [x, yArray[index]])
                })

                const chartType = feature === 'scatter' ? 'scatter' : 'line'

                const seriesArray = []
                for (let i = 0; i < channels; i++) {
                    const dataSeries = {
                        name: `Channel #${i}`,
                        type: chartType,
                        data: channelData[i],
                        showSymbol: false,
                        hoverAnimation: false,
                        lineStyle: {
                            width: 2,
                        },
                        emphasis: {
                            lineStyle: {
                                width: 2,
                            },
                        },
                        smooth: feature === 'spline' ? true : false,
                        step: feature === 'step' ? 'start' : undefined,
                        areaStyle: feature === 'area' ? {} : undefined,
                    }
                    seriesArray.push(dataSeries)
                }

                let endInit = window.performance.now()
                
                window.testPerform = () => {
                    // loading speed test

                    // Initialize chart
                    const chart = echarts.init(document.getElementById('chart'))
                    chart.setOption({
                        animation: false,
                        title: {},
                        xAxis: {
                            type: 'value',
                            min: 0,
                            max: dataSetSize,
                        },
                        yAxis: { type: 'value' },
                        series: seriesArray,
                    })
                    let initTime = endInit - startInit
                    requestAnimationFrame(async () => {
                        window.loadingTestFinished(window.testStart, window.performance.now())
                        await new Promise((resolve) => setTimeout(resolve, 500))
                    })
                }

                window.testReadyToBegin()
            })
        </script>
    </body>
</html>
